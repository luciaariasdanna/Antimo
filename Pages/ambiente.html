<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Fotos | El Ambiente de Antimo Bar</title>
    <meta name="description" content="Mirá las fotos de Antimo Bar. Un ambiente único, decoración exclusiva y la mejor coctelería.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        #carouselExampleFade {
            max-width: 800px;
        }
        /* moved from inline style to avoid inline styles */
        .content-footer {
            border-top: 1px solid #333;
        }
    </style>
</head>
<body class="bg-black text-white">
    <main class="container mt-5 pt-5" role="main">
        <h1 class="text-center mb-4">Nuestro Ambiente</h1>
        
        <!-- Carrusel de Bootstrap fundido cruzado -->
        <div id="carouselExampleFade" class="carousel slide carousel-fade mx-auto" data-bs-ride="carousel" role="region" aria-roledescription="carousel" aria-label="Galería de fotos de Antimo Bar">
            <div class="carousel-inner">
                <div class="carousel-item active" role="group" aria-roledescription="slide" aria-label="1 de 3">
                    <img src="../img/dorrego.webp" class="d-block w-100 rounded" alt="Cartel luminoso de Dorrego 164 en la barra">
                </div>
                <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="2 de 3">
                    <img src="../img/frente.webp" loading="lazy" decoding="async" class="d-block w-100 rounded" alt="Frente de Antimo">
                </div>
                <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="3 de 3">
                    <img src="../img/barra.webp" loading="lazy" decoding="async" class="d-block w-100 rounded" alt="Barra de Antimo">
                </div>
                <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="3 de 3">
                    <img src="../img/cochera.webp" loading="lazy" decoding="async" class="d-block w-100 rounded" alt="Vista desde el costado">
                </div>
                <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="3 de 3">
                    <img src="../img/dobleantimo.webp" loading="lazy" decoding="async" class="d-block w-100 rounded" alt="Cartel luminoso Antimo">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev" aria-label="Ver imagen anterior">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next" aria-label="Ver imagen siguiente">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
        </div>

        <div class="text-center mt-4">
            <a href="../index.html" class="text-secondary">Volver al inicio</a>
        </div>
    </main>
    <footer class="text-center py-4 mt-5 content-footer" role="contentinfo">
        <small class="text-muted">&copy; 2026 Antimo Bar. Dorrego 164, La Rioja</small>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>    
</html>
